name: Build ShieldPro APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # manual trigger button in GitHub UI

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (required for AGP 8+) ────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle cache ──────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Grant execute permission ──────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── 5. Decode keystore from secret ──────────────────────────────────────
      #
      #  How to set up signing secrets in GitHub:
      #  1. Generate a keystore:
      #       keytool -genkey -v -keystore my-upload-key.jks \
      #               -alias upload -keyalg RSA -keysize 2048 -validity 10000
      #  2. Base64-encode it:
      #       base64 -i my-upload-key.jks | tr -d '\n'
      #  3. Go to GitHub repo → Settings → Secrets → Actions → New secret:
      #       KEYSTORE_BASE64   ← paste the base64 string
      #       STORE_PASSWORD    ← your keystore password
      #       KEY_PASSWORD      ← your key password
      #       KEY_ALIAS         ← "upload" (or whatever alias you used)
      #
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/my-upload-key.jks
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV

      # ── 6. Build release APK ─────────────────────────────────────────────────
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      # ── 7. Rename APK with version + date ───────────────────────────────────
      - name: Rename APK
        run: |
          DATE=$(date +'%Y%m%d')
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -o '"[^"]*"' | tr -d '"')
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          APK_NAME="ShieldPro-v${VERSION}-${DATE}.apk"
          cp "$APK_SRC" "${{ github.workspace }}/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK_PATH=${{ github.workspace }}/$APK_NAME" >> $GITHUB_ENV

      # ── 8. Upload APK as build artifact ─────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldPro-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── 9. Auto-create GitHub Release on tag push (v*) ──────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "ShieldPro ${{ github.ref_name }}"
          body: |
            ## 🛡️ ShieldPro ${{ github.ref_name }}

            ### What's in this release
            - Auto ad-skip (YouTube, Facebook, Instagram)
            - Adult content block
            - Reels / Shorts block
            - Schedule Lock (Night Mode)
            - App screen time limits
            - Browser URL filter
            - Custom auto-click actions

            ### Install
            1. Download the APK below
            2. Enable **Install from unknown sources** on your phone
            3. Install and enable Accessibility Service
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
