name: Build JanuAI APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip *.zip
          ls -la

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        working-directory: JanuAI
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK Platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build APK
        working-directory: JanuAI
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JanuAI-APK
          path: JanuAI/app/build/outputs/apk/debug/app-debug.apk
