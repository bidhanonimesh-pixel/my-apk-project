name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: unzip "shieldpro (1).zip" -d project

    - name: Find and build
      run: |
        GRADLEW=$(find project -name "gradlew" -type f | head -1)
        if [ -z "$GRADLEW" ]; then
          echo "gradlew not found! ZIP structure:"
          find project -type f | head -30
          exit 1
        fi
        DIR=$(dirname "$GRADLEW")
        chmod +x "$GRADLEW"
        cd "$DIR"
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/*.apk'
