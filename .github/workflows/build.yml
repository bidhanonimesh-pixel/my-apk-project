name: Android CI Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build ShieldPro APK
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Grant execute permission
      - name: Grant Gradle Permission
        run: chmod +x ./gradlew

      # Clean project
      - name: Clean Project
        run: ./gradlew clean

      # Run lint
      - name: Run Lint
        run: ./gradlew lint
        continue-on-error: true

      # Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldPro-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldPro-Release
          path: app/build/outputs/apk/release/app-release.apk

      # Upload mapping & reports
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ShieldPro-Reports
          path: |
            app/build/reports/
            app/build/outputs/logs/

  security-check:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Permission
        run: chmod +x ./gradlew

      # Dependency vulnerability check
      - name: Dependency Check
        run: ./gradlew dependencies

      # Static code analysis
      - name: Run Detekt
        run: ./gradlew detekt
        continue-on-error: true

      # Kotlin compile verification
      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin

  release-info:
    name: Build Information
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Build Success
        run: |
          echo "ShieldPro Build Completed Successfully"
          echo "Artifacts Uploaded"
          echo "Debug + Release APK Ready"
