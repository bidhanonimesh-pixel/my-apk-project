name: Build APK from ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip project
        run: unzip shieldpro_v5_github_fixed.zip -d project

      - name: Permission
        run: chmod +x project/shieldpro_v5/gradlew

      - name: Build APK
        run: |
          cd project/shieldpro_v5
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldPro-APK
          path: project/shieldpro_v5/app/build/outputs/apk/debug/*.apk
