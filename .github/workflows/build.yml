name: Build JanuAI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📦 Find and extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ কোনো ZIP পাওয়া যায়নি!"
            exit 1
          fi
          echo "✅ ZIP পাওয়া গেছে: $ZIP_FILE"
          unzip -o "$ZIP_FILE"
          PROJECT_DIR=$(unzip -Z1 "$ZIP_FILE" | head -1 | cut -d'/' -f1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project folder: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: 🔧 Make gradlew executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: 🔑 Create debug keystore
        run: |
          cd "$PROJECT_DIR"
          keytool -genkey -v \
            -keystore app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: 🏗️ Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Pandroid.debug.obsoleteApi=true

      - name: 📋 Find built APK
        run: |
          APK=$(find "$PROJECT_DIR" -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "✅ APK: $APK"
          ls -lh "$APK"

      - name: 🚀 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JanuAI-Debug-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: 🎉 Done
        run: echo "✅ JanuAI APK তৈরি হয়ে গেছে! Actions → Artifacts থেকে নামাও।"
