name: Build APK from ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install unzip
        run: sudo apt-get install unzip

      - name: Unzip Project
        run: unzip shieldpro_v5_github_fixed.zip -d project

      - name: Give Permission
        run: chmod +x project/gradlew

      - name: Build APK
        run: |
          cd project
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldPro-APK
          path: project/app/build/outputs/apk/debug/*.apk
