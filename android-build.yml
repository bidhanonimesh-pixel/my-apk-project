name: ShieldPro Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unzip project
        run: unzip -o shieldpro_v5_complete.zip

      - name: Create local.properties and .env
        working-directory: shieldpro_v5
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          touch app/.env app/.env.example

      - name: Build Debug APK
        working-directory: shieldpro_v5
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldPro-Debug-APK
          path: shieldpro_v5/app/build/outputs/apk/debug/*.apk
          retention-days: 30
